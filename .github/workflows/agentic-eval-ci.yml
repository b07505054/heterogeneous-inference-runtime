name: Agentic Eval CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create venv and install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip pytest numpy
      - name: Run validation
        run: bash scripts/check.sh
