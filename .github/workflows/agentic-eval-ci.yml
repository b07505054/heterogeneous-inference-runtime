name: Agentic Eval CI

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create project-local .venv
        run: python -m venv .venv
      - name: Install test dependencies into .venv
        run: .venv/bin/pip install --upgrade pip && .venv/bin/pip install -r requirements-dev.txt
      - name: Run canonical validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: bash scripts/check.sh
